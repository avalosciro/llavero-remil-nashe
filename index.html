<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llavero</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 20px;
        }
        h1 { font-size: 2rem; }
        .boton {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .boton:active { transform: scale(0.95); }
        #botonGrabar { background: #e94560; }
        #botonGrabar.grabando { background: #0f3460; animation: pulso 1s infinite; }
        #botonSync { background: #0f7438; width: 120px; height: 120px; }
        @keyframes pulso {
            0% { box-shadow: 0 0 0 0 rgba(233,69,96,0.7); }
            100% { box-shadow: 0 0 0 20px rgba(233,69,96,0); }
        }
        #estado { font-size: 1rem; color: #aaa; text-align: center; }
        #resultado {
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
            width: 90%;
            display: none;
        }
    </style>
</head>
<body>
    <h1>🔑 Llavero</h1>
    <button id="botonGrabar" class="boton" onclick="toggleGrabacion()">Grabar</button>
    <button id="botonSync" class="boton" onclick="sincronizar()">Sync con llavero</button>
    <p id="estado">Listo</p>
    <div id="resultado">
        <p id="transcripcion"></p>
        <p id="evento"></p>
    </div>

    <script>
        const BACKEND = "https://llavero-remil-nashe.onrender.com";
        const SERVICE_UUID = "6E400001-B5A3-F393-E0A9-E50E24DCCA9E".toLowerCase();
        const CHAR_UUID = "6E400002-B5A3-F393-E0A9-E50E24DCCA9E".toLowerCase();

        let mediaRecorder;
        let chunks = [];
        let grabando = false;
        let bleChar = null;

        async function toggleGrabacion() {
            if (!grabando) {
                chunks = [];
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = enviarAudio;
                mediaRecorder.start();
                grabando = true;
                document.getElementById('botonGrabar').textContent = "Parar";
                document.getElementById('botonGrabar').classList.add('grabando');
                document.getElementById('estado').textContent = "Grabando...";
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                grabando = false;
                document.getElementById('botonGrabar').textContent = "Grabar";
                document.getElementById('botonGrabar').classList.remove('grabando');
                document.getElementById('estado').textContent = "Enviando...";
            }
        }

        async function enviarAudio() {
            const blob = new Blob(chunks, { type: 'audio/mp4' });
            const formData = new FormData();
            formData.append('audio', blob, 'audio.mp4');
            try {
                const res = await fetch(`${BACKEND}/audio`, { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('estado').textContent = "✅ Agendado";
                document.getElementById('resultado').style.display = 'block';
                document.getElementById('transcripcion').textContent = "📝 " + data.transcripcion;
                document.getElementById('evento').textContent = "📅 " + data.evento;
            } catch (err) {
                document.getElementById('estado').textContent = "❌ Error, intentá de nuevo";
            }
        }

        async function sincronizar() {
            try {
                document.getElementById('estado').textContent = "Conectando al llavero...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Llavero' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleChar = await service.getCharacteristic(CHAR_UUID);
                document.getElementById('estado').textContent = "Llavero conectado, obteniendo eventos...";

                const res = await fetch(`${BACKEND}/eventos`);
                const data = await res.json();
                const eventos = data.eventos;

                if (eventos.length === 0) {
                    await enviarBLE("Sin eventos hoy");
                } else {
                    let mensaje = "";
                    for (let e of eventos) {
                        mensaje += `${e.hora} ${e.titulo}|`;
                    }
                    await enviarBLE(mensaje);
                }
                document.getElementById('estado').textContent = "✅ Llavero sincronizado";
            } catch (err) {
                document.getElementById('estado').textContent = "❌ Error: " + err.message;
            }
        }

        async function enviarBLE(texto) {
            const encoder = new TextEncoder();
            const data = encoder.encode(texto);
            const chunkSize = 20;
            for (let i = 0; i < data.length; i += chunkSize) {
                const chunk = data.slice(i, i + chunkSize);
                await bleChar.writeValue(chunk);
                await new Promise(r => setTimeout(r, 50));
            }
        }
    </script>
</body>
</html>
