<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17161F">
<title>Llavero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ============ BARRA SUPERIOR ============ -->
<header class="barra-sup">
  <div class="fila-busqueda">
    <input type="search" id="buscador" placeholder="Buscar" autocomplete="off">
    <button id="btnSync" class="btn-icono sync" title="Sincronizar llavero">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
    </button>
  </div>
  <p id="migas" class="migas">Notas</p>
</header>

<!-- ============ CONTENIDO ============ -->
<main id="contenido">

  <!-- --------- VISTA NOTAS --------- -->
  <section id="vistaNotas" class="vista activa">
    <div id="gridNotas" class="grid"></div>
    <div id="vacioNotas" class="vacio">
      <span class="vacio-emoji">📝</span>
      <p>Todavía no hay notas.</p>
      <p class="vacio-sub">Tocá el + para escribir la primera.</p>
    </div>
  </section>

  <!-- --------- VISTA LISTAS --------- -->
  <section id="vistaListas" class="vista">
    <div id="gridListas" class="grid"></div>
    <div id="vacioListas" class="vacio">
      <span class="vacio-emoji">✅</span>
      <p>Todavía no hay listas.</p>
      <p class="vacio-sub">Tocá el + para armar la primera.</p>
    </div>
  </section>

  <!-- --------- VISTA EDITOR DE NOTA --------- -->
  <section id="vistaNota" class="vista">
    <input type="text" id="tituloNota" class="titulo-editable" placeholder="Título de la nota">

    <div class="toolbar">
      <button class="tb" data-cmd="bold"><b>B</b></button>
      <button class="tb" data-cmd="italic"><i>I</i></button>
      <button class="tb" data-cmd="underline"><u>U</u></button>
      <button class="tb" data-cmd="strikeThrough"><s>S</s></button>
      <button class="tb" data-cmd="insertUnorderedList">•—</button>
      <select id="selTamano" class="tb-sel">
        <option value="2">Chico</option>
        <option value="3" selected>Normal</option>
        <option value="5">Grande</option>
        <option value="7">Titular</option>
      </select>
      <select id="selFuente" class="tb-sel">
        <option value="'Space Grotesk',sans-serif">Space</option>
        <option value="Georgia,serif">Georgia</option>
        <option value="'Courier New',monospace">Mono</option>
        <option value="'Archivo Black',sans-serif">Archivo</option>
      </select>
      <div class="colores">
        <button class="sw" data-color="#F2F0F7" style="background:#F2F0F7"></button>
        <button class="sw" data-color="#9FE8C8" style="background:#9FE8C8"></button>
        <button class="sw" data-color="#C0AEF0" style="background:#C0AEF0"></button>
        <button class="sw" data-color="#FFB59C" style="background:#FFB59C"></button>
        <button class="sw" data-color="#FFDD8F" style="background:#FFDD8F"></button>
      </div>
    </div>

    <div id="cuerpoNota" class="cuerpo" contenteditable="true" data-placeholder="Escribí acá, o dictá con el micrófono."></div>

    <div class="acciones-editor">
      <button id="micNota" class="btn-bloque menta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        Dictar
      </button>
      <button id="borrarNota" class="btn-bloque durazno">Eliminar</button>
    </div>
  </section>

  <!-- --------- VISTA EDITOR DE LISTA --------- -->
  <section id="vistaLista" class="vista">
    <input type="text" id="tituloLista" class="titulo-editable" placeholder="Título de la lista">

    <div class="agregar-item">
      <input type="text" id="nuevoItem" placeholder="Agregar ítem" autocomplete="off">
      <button id="addItem" class="btn-icono lila">+</button>
    </div>

    <ul id="itemsLista" class="items"></ul>

    <div class="acciones-editor">
      <button id="micLista" class="btn-bloque menta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        Dictar ítem
      </button>
      <button id="borrarLista" class="btn-bloque durazno">Eliminar</button>
    </div>
  </section>

</main>

<!-- ============ BOTÓN FLOTANTE NUEVO ============ -->
<button id="btnNuevo" class="fab-nuevo">+</button>

<!-- ============ NAV INFERIOR ============ -->
<nav class="nav-inf">
  <button id="navNotas" class="nav-btn activo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 3h11l5 5v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v5h5"/><path d="M8 13h8"/><path d="M8 17h5"/>
    </svg>
    <span>Notas</span>
  </button>

  <button id="btnGrabar" class="fab-grabar" aria-label="Grabar y agendar">
    <svg class="ico-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>
    </svg>
    <span class="ico-stop"></span>
  </button>

  <button id="navListas" class="nav-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="m3 6 1 1 2-2"/><path d="m3 12 1 1 2-2"/><path d="m3 18 1 1 2-2"/>
    </svg>
    <span>Listas</span>
  </button>
</nav>

<!-- ============ AVISO ============ -->
<div id="aviso" class="aviso"></div>

<script src="/app.js"></script>
</body>
</html>
